      <div class="container header-inner">
        <a href="index.html" class="brand" aria-label="SECURITIES KNOWLEDGE ATLAS ホームへ移動">
          <span class="brand-mark">S</span>

          <a class="nav-link" href="index.html" data-page="index">ホーム</a>
          <a class="nav-link" href="flow.html" data-page="flow">業務マップ</a>

        </nav>
        <div class="header-actions">
          <form class="quick-search" data-site-search-form>
            <label class="visually-hidden" for="site-search-glossary">サイト内検索</label>
            <input id="site-search-glossary" type="search" placeholder="検索" data-site-search-input />
          </form>
          <button class="menu-toggle" type="button" aria-expanded="false" aria-label="メニューを開く">メニュー</button>
        </div>
      </div>
    </header>

    <main id="main-content" class="site-main">
      <div class="container page-head reveal">
        <span class="page-kicker">SECURITIES GLOSSARY</span>
        <h1>証券業務用語集</h1>
      </div>

      <section class="container section reveal">
        <div class="filter-panel">
          <div class="filter-grid">
            <label>
              <span class="visually-hidden">用語検索</span>
              <input id="glossary-search" class="filter-input" type="search" placeholder="用語、英語表記、説明を検索" />
            </label>
            <label>
              <span class="visually-hidden">カテゴリー</span>
              <select id="glossary-category" class="filter-select">
                <option value="">カテゴリーを選択</option>
              </select>
            </label>
            <label>
              <span class="visually-hidden">五十音</span>
              <select id="glossary-kana" class="filter-select">
                <option value="">五十音で絞り込み</option>
                <option value="あ">あ行</option>
                <option value="か">か行</option>
                <option value="さ">さ行</option>
                <option value="た">た行</option>
                <option value="な">な行</option>
                <option value="は">は行</option>
                <option value="ま">ま行</option>
                <option value="や">や行</option>
                <option value="ら">ら行</option>
                <option value="わ">わ行</option>
              </select>
            </label>
          </div>
          <div class="results-bar">
            <button type="button" id="reset-glossary" class="ghost-button">条件をリセット</button>
            <div class="result-count" id="glossary-result-count" aria-live="polite">0件</div>
          </div>
        </div>
      </section>

      <section class="container section reveal">
        <div class="term-grid" id="glossary-list" aria-live="polite"></div>
      </section>
    </main>

    <aside class="modal-backdrop" id="glossary-modal" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="glossary-modal-title">
        <div class="modal-header">
          <h3 id="glossary-modal-title">用語詳細</h3>
          <button type="button" class="ghost-button" data-close-glossary>閉じる</button>
        </div>
        <div class="modal-body" id="glossary-detail"></div>
      </div>
    </aside>

      </div>
