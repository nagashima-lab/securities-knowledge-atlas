<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="証券業務のナレッジ一覧を検索、絞り込み、ブックマークしながら確認できるページです。" />
    <meta name="theme-color" content="#102a43" />
    <title>ナレッジ一覧 | SECURITIES KNOWLEDGE ATLAS</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="knowledge">
    <a class="skip-link" href="#main-content">本文へスキップ</a>

    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="brand" aria-label="SECURITIES KNOWLEDGE ATLAS ホームへ移動">
          <span class="brand-mark">S</span>
          <span>SECURITIES KNOWLEDGE ATLAS</span>
        </a>
        <nav class="main-nav" aria-label="メインナビゲーション">
          <a class="nav-link" href="index.html" data-page="index">ホーム</a>
          <a class="nav-link" href="flow.html" data-page="flow">業務マップ</a>
          <a class="nav-link" href="knowledge.html" data-page="knowledge" aria-current="page">ナレッジ</a>
          <a class="nav-link" href="glossary.html" data-page="glossary">用語集</a>
          <a class="nav-link" href="troubleshooting.html" data-page="troubleshooting">困りごとから探す</a>
          <a class="nav-link" href="learning.html" data-page="learning">学習コース</a>
          <a class="nav-link" href="about.html" data-page="about">このサイトについて</a>
        </nav>
        <div class="header-actions">
          <form class="quick-search" data-site-search-form>
            <label class="visually-hidden" for="site-search-knowledge">サイト内検索</label>
            <input id="site-search-knowledge" type="search" placeholder="検索" data-site-search-input />
          </form>
          <button class="menu-toggle" type="button" aria-expanded="false" aria-label="メニューを開く">メニュー</button>
        </div>
      </div>
    </header>

    <main id="main-content" class="site-main">
      <div class="container page-head reveal">
        <span class="page-kicker">KNOWLEDGE LIBRARY</span>
        <h1>ナレッジ一覧</h1>
      </div>

      <section class="container section reveal">
        <div class="filter-panel">
          <div class="filter-grid">
            <label>
              <span class="visually-hidden">検索</span>
              <input id="knowledge-search" class="filter-input" type="search" placeholder="キーワードで検索" />
            </label>
            <label>
              <span class="visually-hidden">業務領域</span>
              <select id="category-filter" class="filter-select">
                <option value="">業務領域を選択</option>
              </select>
            </label>
            <label>
              <span class="visually-hidden">難易度</span>
              <select id="difficulty-filter" class="filter-select">
                <option value="">難易度を選択</option>
                <option value="入門">入門</option>
                <option value="中級">中級</option>
              </select>
            </label>
            <label>
              <span class="visually-hidden">対象者</span>
              <select id="audience-filter" class="filter-select">
                <option value="">対象者を選択</option>
              </select>
            </label>
            <label>
              <span class="visually-hidden">コンテンツ種別</span>
              <select id="type-filter" class="filter-select">
                <option value="">コンテンツ種別を選択</option>
              </select>
            </label>
            <label>
              <span class="visually-hidden">並び替え</span>
              <select id="sort-order" class="filter-select">
                <option value="title">タイトル順</option>
                <option value="readingTime">読了時間順</option>
                <option value="category">カテゴリ順</option>
              </select>
            </label>
          </div>
          <div class="results-bar">
            <div class="label-row">
              <button type="button" id="bookmark-toggle" class="secondary-button">ブックマークのみ表示</button>
              <button type="button" id="reset-filters" class="ghost-button">条件をリセット</button>
            </div>
            <div class="result-count" id="knowledge-result-count" aria-live="polite">0件</div>
          </div>
        </div>
      </section>

      <section class="container section reveal">
        <div class="knowledge-grid" id="knowledge-list" aria-live="polite"></div>
      </section>
    </main>

    <aside class="modal-backdrop" id="knowledge-modal" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="knowledge-modal-title">
        <div class="modal-header">
          <h3 id="knowledge-modal-title">ナレッジ詳細</h3>
          <button type="button" class="ghost-button" data-close-knowledge>閉じる</button>
        </div>
        <div class="modal-body" id="knowledge-detail"></div>
      </div>
    </aside>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-inner">
          <div>
            <h3>SECURITIES KNOWLEDGE ATLAS</h3>
            <p>証券業務を、点ではなく流れで理解する。</p>
          </div>
          <nav class="footer-nav" aria-label="サイト内ナビゲーション">
            <a href="index.html">ホーム</a>
            <a href="flow.html">業務マップ</a>
            <a href="knowledge.html">ナレッジ</a>
            <a href="glossary.html">用語集</a>
            <a href="troubleshooting.html">困りごとから探す</a>
            <a href="learning.html">学習コース</a>
          </nav>
        </div>
        <p class="footer-note">本サイトはUI・ナレッジ設計を目的としたデモサイトです。実務・取引・投資判断には使用しないでください。</p>
        <p class="footer-meta">© Securities Knowledge Atlas Demo</p>
      </div>
    </footer>

    <script src="js/storage.js"></script>
    <script src="js/main.js"></script>
    <script src="data/knowledge-data.js"></script>
    <script src="js/knowledge.js"></script>
  </body>
</html>
